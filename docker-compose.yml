version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: aistudyhub_db
    # unless-stopped: tự restart khi crash, KHÔNG restart nếu người dùng chủ động stop
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aistudyhublms
      MYSQL_ROOT_PASSWORD: "123456"
      # Tránh lỗi authentication plugin với PHP PDO/MySQLi
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    volumes:
      # Named volume: dữ liệu MySQL KHÔNG bao giờ bị mất khi restart/rebuild container
      - db_data:/var/lib/mysql
      # Tự động import schema và seed data khi DB khởi tạo lần đầu tiên
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - aistudyhub_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aistudyhub_web
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      # Ghi đè DB_HOST từ localhost → tên service db trong Docker internal network
      DB_HOST: db
      DB_NAME: aistudyhublms
      DB_USER: root
      DB_PASS: "123456"
    volumes:
      # Named volumes to avoid Windows bind mount space limitations & syncing issues
      - lms_storage:/var/www/html/storage
      - lms_uploads:/var/www/html/public/uploads
      - lms_course_images:/var/www/html/public/uploads/courses
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aistudyhub_net

  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aistudyhub_websocket
    # Override CMD: chạy WebSocket server thay vì Apache
    command: php server.php
    restart: unless-stopped
    ports:
      # Expose port 8080 để kết nối trực tiếp khi dev local (localhost:8080)
      # Khi chạy qua Cloudflare Tunnel / VPS, Apache sẽ proxy /ws → websocket:8080
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_NAME: aistudyhublms
      DB_USER: root
      DB_PASS: "123456"
      WS_PORT: 8080
      # WebSocket server lắng nghe trên 0.0.0.0 để nhận kết nối từ mọi interface
      WS_HOST: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aistudyhub_net

volumes:
  # Named volume được Docker quản lý, tồn tại độc lập với container lifecycle
  db_data:
    driver: local
  lms_storage:
    driver: local
  lms_uploads:
    driver: local
  # Volume riêng cho ảnh thumbnail khóa học - tồn tại bền vững qua mọi lần rebuild
  lms_course_images:
    driver: local

networks:
  aistudyhub_net:
    driver: bridge
